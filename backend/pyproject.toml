[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "alembic>=1.20.0",
    "yfinance==1.7.0",
    "pyportfolioopt>=1.5.6,<2",
    "packaging>=24,<27",
]

[tool.uv]
package = false   # this is an app, not a library to publish

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
